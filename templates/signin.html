{% extends "base.html" %}

{% block title %}
Theory Test App - Sign In
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/signin.css') }}">
{% endblock %}

{% block content %}
<!-- Main sign-in page wrapper -->
<div class="signin-page">
    <!-- Centered card containing all sign-in UI -->
    <div class="signin-card">
        <!-- Page heading -->
        <div class="title-box">Sign In</div>

        <!-- Role selection buttons; user must pick one before submitting -->
        <div class="role-row">
            <button type="button" id="student-btn" class="role-btn">Student</button>
            <button type="button" id="instructor-btn" class="role-btn">Instructor</button>
        </div>

        <!-- Sign-in form sent to the authorisation route -->
        <form id="signin-form" action="/auth/authorise_user" method="post" class="signin-form">
            <!-- Stores selected role for backend processing -->
            <input type="hidden" name="user_type" id="user_type" value="">

            <!-- Username input -->
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <!-- Email input -->
            <div class="field-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Password input -->
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="bottom-row">
                <!-- Link to account creation page -->
                <a href="/" class="signup-link">Don't have an account?<br>Sign Up</a>

                <!-- Shows first flashed error message, if one exists -->
                <div class="error-message">
                    {% if messages %}
                        {{ messages[0] }}
                    {% endif %}
                </div>

                <!-- Disabled until a role is selected -->
                <button id="submit-btn" type="submit" class="submit-btn" disabled>Submit</button>
            </div>
        </form>
    </div>
</div>

<script>
// Grab elements used for role selection and form submission checks.
const signinForm = document.getElementById('signin-form');
const submitBtn = document.getElementById('submit-btn');
const studentBtn = document.getElementById('student-btn');
const instructorBtn = document.getElementById('instructor-btn');
const userTypeInput = document.getElementById('user_type');

// Set role to student and enable submit.
studentBtn.addEventListener('click', function() {
    userTypeInput.value = 'student';
    submitBtn.disabled = false;
    studentBtn.classList.add('active');
    instructorBtn.classList.remove('active');
});

// Set role to instructor and enable submit.
instructorBtn.addEventListener('click', function() {
    userTypeInput.value = 'instructor';
    submitBtn.disabled = false;
    instructorBtn.classList.add('active');
    studentBtn.classList.remove('active');
});

// Prevent submit if no role has been selected.
signinForm.addEventListener('submit', function(event) {
    if (!userTypeInput.value) {
        event.preventDefault();
        alert('Please choose student or instructor before signing in.');
    }
});
</script>
{% endblock %}
